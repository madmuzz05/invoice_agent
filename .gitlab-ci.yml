# Pipeline GitLab kantor — pola sama dengan UAM-FE.
#
#   development : build, lint, test, SonarQube, SBOM, image :development, deploy ke server dev,
#                 health check (otomatis)
#   main        : build, lint, test, SBOM, image :production, deploy ke server prod saat tombol
#                 ▶ deploy-production diklik, lalu health check
#   MR          : build, lint, test, SBOM
#
# Variabel CI/CD:
#   Server (group pismart): SSH_HOST_PISMART_DEV, SSH_KEY_PISMART_DEV (dev),
#     SSH_HOST_PISMART_2ND + SSH_KEY_PISMART (prod), SERVER_SSH_PORT, SERVER_SSH_USER
#   Aplikasi (project, scope per environment atau "*"):
#     APP_HOST_PORT                                   port di server → container 8080
#     PINTER_API_KEY                                  wajib
#     OPENAI_BASE_URL, OPENAI_API_KEY, OPENAI_MODEL   atau GOOGLE_API_KEY + GEMINI_MODEL
#     Opsional (tidak ditulis ke .env jika tidak di-set): PINTER_TRX_TTL_DAYS,
#     LLM_REASONING_EFFORT, LLM_SEND_PAGE_IMAGES, LLM_MAX_PARALLEL_CALLS, ENABLE_DOCS,
#     MAX_UPLOAD_MB, MAX_CONCURRENT_JOBS, JOB_TTL_SECONDS
#   Opsional (job di-skip jika kosong): SONAR_HOST_URL, SONAR_TOKEN,
#     DEPENDENCY_TRACK_URL, DEPENDENCY_TRACK_API_KEY

stages:
  - build
  - code-quality
  - code-security
  - development
  - production

default:
  tags:
    - pupuk

variables:
  DOCKER_IMAGE_TAG: '${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}'
  DOCKER_IMAGE_LATEST: '${CI_REGISTRY_IMAGE}:development'
  DOCKER_IMAGE_PRODUCTION: '${CI_REGISTRY_IMAGE}:production'
  APP_NAME: pismart-invoice-agent

.python-job:
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
    PIP_DISABLE_PIP_VERSION_CHECK: '1'
  cache:
    key:
      files:
        - requirements.txt
        - requirements-dev.txt
    paths:
      - .cache/pip/
    policy: pull-push
  before_script:
    - |
      attempt=1
      until pip install -r requirements-dev.txt; do
        if [ "$attempt" -ge 3 ]; then
          echo "pip install failed after ${attempt} attempts"
          exit 1
        fi
        attempt=$((attempt + 1))
        echo "Retrying pip install (${attempt}/3) after install failure..."
        sleep 5
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

#######################################
# BUILD (install dependency + compile)
#######################################
build:
  extends: .python-job
  stage: build
  script:
    - python -m compileall -q invoice_verifier run_web.py

#######################################
# CODE QUALITY
#######################################
lint:
  extends: .python-job
  stage: code-quality
  needs: [build]
  script:
    - ruff check .

test-unit:
  extends: .python-job
  stage: code-quality
  needs: [build]
  script:
    # Tesseract dipakai tes OCR di tests/unit/test_read_document.py.
    - apt-get update
    - apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
    - pytest -q --junitxml=report.xml --cov=invoice_verifier --cov-report=term --cov-report=xml
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 day

#######################################
# SAST
#######################################
sast:
  stage: code-security
  needs:
    - job: lint
      artifacts: false
    - job: test-unit
      artifacts: true
  image:
    name: sonarsource/sonar-scanner-cli:11.0
    entrypoint: ['']
  variables:
    GIT_DEPTH: '0'
    SONAR_USER_HOME: '$CI_PROJECT_DIR/.sonar'
  cache:
    key: 'sonar-${CI_PROJECT_PATH_SLUG}'
    paths:
      - .sonar/cache/
    policy: pull-push
  script:
    - |
      if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
        echo "Skipping SonarQube scan because SONAR_HOST_URL or SONAR_TOKEN is not set."
        exit 0
      fi

      sonar-scanner \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.login="$SONAR_TOKEN" \
        -Dsonar.projectKey="${PROJECT_NAME:-$CI_PROJECT_PATH_SLUG}" \
        -Dsonar.sources=invoice_verifier \
        -Dsonar.tests=tests \
        -Dsonar.python.version=3.12 \
        -Dsonar.python.coverage.reportPaths=coverage.xml
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'

#######################################
# SBOM
#######################################
sbom:
  stage: code-security
  needs: [lint]
  image:
    name: ghcr.io/aquasecurity/trivy:0.69.3
    entrypoint: ['']
  before_script:
    - apk add --no-cache curl
  script:
    - trivy fs --format cyclonedx --output sbom.xml .
    - |
      if [ -z "$DEPENDENCY_TRACK_URL" ] || [ -z "$DEPENDENCY_TRACK_API_KEY" ]; then
        echo "Skipping Dependency-Track upload because variables are not set."
        exit 0
      fi

      curl -X POST "${DEPENDENCY_TRACK_URL%/}/api/v1/bom" \
        -H "X-Api-Key:${DEPENDENCY_TRACK_API_KEY}" \
        -H "Content-Type:multipart/form-data" \
        -F "bom=@sbom.xml" \
        -F "projectName=${PROJECT_NAME:-$CI_PROJECT_NAME}"
  artifacts:
    paths:
      - sbom.xml
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

#######################################
# BUILD DOCKER IMAGE (DEVELOPMENT)
#######################################
build-development:
  stage: development
  needs:
    - job: build
      artifacts: false
    - job: sast
      artifacts: false
    - job: sbom
      artifacts: false
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: ['']
  script:
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${DOCKER_IMAGE_TAG}"
      --destination "${DOCKER_IMAGE_LATEST}"
      --cache=true
      --cache-repo "${CI_REGISTRY_IMAGE}/cache"
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
  environment:
    name: development

#######################################
# BUILD DOCKER IMAGE (PRODUCTION)
#######################################
build-production:
  stage: production
  needs:
    - job: build
      artifacts: false
    - job: lint
      artifacts: false
    - job: test-unit
      artifacts: false
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: ['']
  script:
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${DOCKER_IMAGE_TAG}"
      --destination "${DOCKER_IMAGE_PRODUCTION}"
      --cache=true
      --cache-repo "${CI_REGISTRY_IMAGE}/cache"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production

#######################################
# DEPLOY DEVELOPMENT (DOCKER COMPOSE)
#######################################
deploy-development:
  stage: development
  resource_group: development
  needs:
    - build-development
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - test -n "$SSH_KEY_PISMART_DEV"
    - printf '%s\n' "$SSH_KEY_PISMART_DEV" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - test -n "$SSH_HOST_PISMART_DEV"
    - test -n "$SERVER_SSH_PORT"
    - test -n "$SERVER_SSH_USER"
    - test -n "$APP_HOST_PORT"
    - test -n "$PINTER_API_KEY"
    - test -n "${OPENAI_API_KEY}${GOOGLE_API_KEY}"
    - echo "Deploying to $SSH_HOST_PISMART_DEV:$SERVER_SSH_PORT"
    # Variabel opsional memakai ${VAR+...}: tidak di-set = baris kosong = default aplikasi.
    - |
      ssh -i ~/.ssh/id_rsa -p "$SERVER_SSH_PORT" \
      -o StrictHostKeyChecking=accept-new \
      "$SERVER_SSH_USER@$SSH_HOST_PISMART_DEV" bash -s << ENDSSH
        set -eu

        echo "${CI_REGISTRY_PASSWORD}" |
          docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"

        mkdir -p ~/deployments/${APP_NAME}
        cd ~/deployments/${APP_NAME}

        cat > .env << 'EOF'
      APP_ENV=production
      PORT=8080
      TZ=Asia/Jakarta
      PINTER_API_KEY=${PINTER_API_KEY}
      ${OPENAI_BASE_URL+OPENAI_BASE_URL=${OPENAI_BASE_URL}}
      ${OPENAI_API_KEY+OPENAI_API_KEY=${OPENAI_API_KEY}}
      ${OPENAI_MODEL+OPENAI_MODEL=${OPENAI_MODEL}}
      ${GOOGLE_API_KEY+GOOGLE_API_KEY=${GOOGLE_API_KEY}}
      ${GEMINI_MODEL+GEMINI_MODEL=${GEMINI_MODEL}}
      ${PINTER_TRX_TTL_DAYS+PINTER_TRX_TTL_DAYS=${PINTER_TRX_TTL_DAYS}}
      ${LLM_REASONING_EFFORT+LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT}}
      ${LLM_SEND_PAGE_IMAGES+LLM_SEND_PAGE_IMAGES=${LLM_SEND_PAGE_IMAGES}}
      ${LLM_MAX_PARALLEL_CALLS+LLM_MAX_PARALLEL_CALLS=${LLM_MAX_PARALLEL_CALLS}}
      ${ENABLE_DOCS+ENABLE_DOCS=${ENABLE_DOCS}}
      ${MAX_UPLOAD_MB+MAX_UPLOAD_MB=${MAX_UPLOAD_MB}}
      ${MAX_CONCURRENT_JOBS+MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS}}
      ${JOB_TTL_SECONDS+JOB_TTL_SECONDS=${JOB_TTL_SECONDS}}
      EOF
        chmod 600 .env

        cat > docker-compose.yml << 'COMPOSE'
      services:
        ${APP_NAME}:
          image: ${DOCKER_IMAGE_TAG}
          container_name: ${APP_NAME}
          init: true
          read_only: true
          tmpfs:
            - /tmp
          security_opt:
            - no-new-privileges:true
          cap_drop:
            - ALL
          mem_limit: 2g
          memswap_limit: 2g
          cpus: 2.0
          pids_limit: 512
          ports:
            - "${APP_HOST_PORT}:8080"
          env_file:
            - .env
          volumes:
            # SQLite & upload sementara; tetap ada saat redeploy.
            - runtime:/app/runtime
          restart: unless-stopped
          healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 40s
          logging:
            driver: "json-file"
            options:
              max-size: "10m"
              max-file: "3"
      volumes:
        runtime:
          name: ${APP_NAME}-runtime
      COMPOSE

        docker compose config --quiet
        docker compose pull ${APP_NAME}
        docker compose up -d --no-deps --force-recreate ${APP_NAME}

        attempts=0
        until [ "\$(docker inspect --format='{{.State.Health.Status}}' ${APP_NAME})" = "healthy" ]; do
          attempts=\$((attempts + 1))
          if [ "\$attempts" -ge 12 ]; then
            docker compose ps
            docker compose logs --tail=100 ${APP_NAME}
            exit 1
          fi
          sleep 5
        done

        docker compose ps
        docker image prune -f --filter "until=168h"
        docker logout "${CI_REGISTRY}"
        echo "Deployment completed successfully"
      ENDSSH
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
  environment:
    name: development
    url: http://${SSH_HOST_PISMART_DEV}:${APP_HOST_PORT}

#######################################
# EXTERNAL HEALTH CHECK
#######################################
health-check-development:
  stage: development
  needs:
    - deploy-development
  image: alpine:3.20
  script:
    - apk add --no-cache curl
    - >
      curl --fail --silent --show-error
      --retry 6
      --retry-delay 5
      --retry-all-errors
      "http://${SSH_HOST_PISMART_DEV}:${APP_HOST_PORT}/health"
      > /dev/null
    - echo "Health check passed"
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
  environment:
    name: development

#######################################
# MANUAL CONTAINER RESTART
#######################################
restart-development:
  stage: development
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - printf '%s\n' "$SSH_KEY_PISMART_DEV" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - |
      ssh -i ~/.ssh/id_rsa -p "$SERVER_SSH_PORT" \
      -o StrictHostKeyChecking=accept-new \
      "$SERVER_SSH_USER@$SSH_HOST_PISMART_DEV" << ENDSSH
        set -eu
        cd ~/deployments/${APP_NAME}
        docker compose restart ${APP_NAME}
        docker compose ps
        docker compose logs --tail=50 ${APP_NAME}
      ENDSSH
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
      when: manual
      allow_failure: true
  environment:
    name: development

#######################################
# DEPLOY PRODUCTION (DOCKER COMPOSE) — manual: klik ▶ deploy-production
#######################################
deploy-production:
  stage: production
  resource_group: production
  needs:
    - build-production
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - test -n "$SSH_KEY_PISMART"
    - printf '%s\n' "$SSH_KEY_PISMART" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - test -n "$SSH_HOST_PISMART_2ND"
    - test -n "$SERVER_SSH_PORT"
    - test -n "$SERVER_SSH_USER"
    - test -n "$APP_HOST_PORT"
    - test -n "$PINTER_API_KEY"
    - test -n "${OPENAI_API_KEY}${GOOGLE_API_KEY}"
    - echo "Deploying to $SSH_HOST_PISMART_2ND:$SERVER_SSH_PORT"
    - |
      ssh -i ~/.ssh/id_rsa -p "$SERVER_SSH_PORT" \
      -o StrictHostKeyChecking=accept-new \
      "$SERVER_SSH_USER@$SSH_HOST_PISMART_2ND" bash -s << ENDSSH
        set -eu

        echo "${CI_REGISTRY_PASSWORD}" |
          docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"

        mkdir -p ~/deployments/${APP_NAME}
        cd ~/deployments/${APP_NAME}

        cat > .env << 'EOF'
      APP_ENV=production
      PORT=8080
      TZ=Asia/Jakarta
      PINTER_API_KEY=${PINTER_API_KEY}
      ${OPENAI_BASE_URL+OPENAI_BASE_URL=${OPENAI_BASE_URL}}
      ${OPENAI_API_KEY+OPENAI_API_KEY=${OPENAI_API_KEY}}
      ${OPENAI_MODEL+OPENAI_MODEL=${OPENAI_MODEL}}
      ${GOOGLE_API_KEY+GOOGLE_API_KEY=${GOOGLE_API_KEY}}
      ${GEMINI_MODEL+GEMINI_MODEL=${GEMINI_MODEL}}
      ${PINTER_TRX_TTL_DAYS+PINTER_TRX_TTL_DAYS=${PINTER_TRX_TTL_DAYS}}
      ${LLM_REASONING_EFFORT+LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT}}
      ${LLM_SEND_PAGE_IMAGES+LLM_SEND_PAGE_IMAGES=${LLM_SEND_PAGE_IMAGES}}
      ${LLM_MAX_PARALLEL_CALLS+LLM_MAX_PARALLEL_CALLS=${LLM_MAX_PARALLEL_CALLS}}
      ${ENABLE_DOCS+ENABLE_DOCS=${ENABLE_DOCS}}
      ${MAX_UPLOAD_MB+MAX_UPLOAD_MB=${MAX_UPLOAD_MB}}
      ${MAX_CONCURRENT_JOBS+MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS}}
      ${JOB_TTL_SECONDS+JOB_TTL_SECONDS=${JOB_TTL_SECONDS}}
      EOF
        chmod 600 .env

        cat > docker-compose.yml << 'COMPOSE'
      services:
        ${APP_NAME}:
          image: ${DOCKER_IMAGE_TAG}
          container_name: ${APP_NAME}
          init: true
          read_only: true
          tmpfs:
            - /tmp
          security_opt:
            - no-new-privileges:true
          cap_drop:
            - ALL
          mem_limit: 2g
          memswap_limit: 2g
          cpus: 2.0
          pids_limit: 512
          ports:
            - "${APP_HOST_PORT}:8080"
          env_file:
            - .env
          volumes:
            # SQLite & upload sementara; tetap ada saat redeploy.
            - runtime:/app/runtime
          restart: unless-stopped
          healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 40s
          logging:
            driver: "json-file"
            options:
              max-size: "10m"
              max-file: "3"
      volumes:
        runtime:
          name: ${APP_NAME}-runtime
      COMPOSE

        docker compose config --quiet
        docker compose pull ${APP_NAME}
        docker compose up -d --no-deps --force-recreate ${APP_NAME}

        attempts=0
        until [ "\$(docker inspect --format='{{.State.Health.Status}}' ${APP_NAME})" = "healthy" ]; do
          attempts=\$((attempts + 1))
          if [ "\$attempts" -ge 12 ]; then
            docker compose ps
            docker compose logs --tail=100 ${APP_NAME}
            exit 1
          fi
          sleep 5
        done

        docker compose ps
        docker image prune -f --filter "until=168h"
        docker logout "${CI_REGISTRY}"
        echo "Production deployment completed successfully"
      ENDSSH
  rules:
    # Manual tanpa allow_failure: pipeline main berstatus "blocked" sampai deploy diklik,
    # dan health-check-production menunggu job ini.
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production
    url: http://${SSH_HOST_PISMART_2ND}:${APP_HOST_PORT}

#######################################
# EXTERNAL HEALTH CHECK (PRODUCTION)
#######################################
health-check-production:
  stage: production
  needs:
    - deploy-production
  image: alpine:3.20
  script:
    - apk add --no-cache curl
    - test -n "$SSH_HOST_PISMART_2ND"
    - test -n "$APP_HOST_PORT"
    - >
      curl --fail --silent --show-error
      --retry 6
      --retry-delay 5
      --retry-all-errors
      "http://${SSH_HOST_PISMART_2ND}:${APP_HOST_PORT}/health"
      > /dev/null
    - echo "Production health check passed"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production

#######################################
# MANUAL CONTAINER RESTART (PRODUCTION)
#######################################
restart-production:
  stage: production
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - test -n "$SSH_KEY_PISMART"
    - printf '%s\n' "$SSH_KEY_PISMART" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - test -n "$SSH_HOST_PISMART_2ND"
    - test -n "$SERVER_SSH_PORT"
    - test -n "$SERVER_SSH_USER"
    - |
      ssh -i ~/.ssh/id_rsa -p "$SERVER_SSH_PORT" \
      -o StrictHostKeyChecking=accept-new \
      "$SERVER_SSH_USER@$SSH_HOST_PISMART_2ND" << ENDSSH
        set -eu
        cd ~/deployments/${APP_NAME}
        docker compose restart ${APP_NAME}
        docker compose ps
        docker compose logs --tail=50 ${APP_NAME}
      ENDSSH
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  environment:
    name: production
